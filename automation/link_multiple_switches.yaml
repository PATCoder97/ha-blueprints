blueprint:
  name: Synchronize Multiple Switches
  description: |
    Keep the on/off state of multiple switch entities synchronized.
    When one selected switch changes state, all selected switches that
    are currently in the opposite state receive the matching command.

    Unknown and unavailable states are ignored as both triggers and targets.

    Requires Home Assistant 2022.5.0 or newer.

    Based on the original blueprint by aderusha:
    https://gist.github.com/aderusha/4f25658dbb855675b5b5ccf296fd801b

  domain: automation
  source_url: https://github.com/PATCoder97/ha-blueprints/blob/main/automation/link_multiple_switches.yaml

  homeassistant:
    min_version: 2022.5.0

  input:
    switches:
      name: Switch Entities
      description: Select switches to synchronize
      selector:
        entity:
          domain:
            - switch
          multiple: true
          reorder: false

mode: queued
max_exceeded: silent

variables:
  switches: !input switches

trigger:
  - platform: state
    entity_id: !input switches

condition:
  # Ignore state-change events without a new state.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none }}

  # Do not synchronize an entity's initial state registration.
  - condition: template
    value_template: >
      {{ trigger.from_state is not none }}

  # Ignore unknown, unavailable, and other non-binary states.
  - condition: template
    value_template: >
      {{ trigger.to_state.state in ['on', 'off'] }}

  # Ignore attribute-only updates.
  - condition: template
    value_template: >
      {{ trigger.to_state.state != trigger.from_state.state }}

action:
  # Target only switches that are currently in the opposite state.
  # This excludes unknown/unavailable switches and stops sync loops naturally.
  - variables:
      target_switches: >
        {{
          expand(switches)
          | selectattr(
              'state',
              'eq',
              'off' if trigger.to_state.state == 'on' else 'on'
            )
          | map(attribute='entity_id')
          | list
        }}

  # A queued run may no longer have any work after an earlier run finishes.
  - condition: template
    value_template: >
      {{ target_switches | count > 0 }}

  - service: "homeassistant.turn_{{ trigger.to_state.state }}"
    target:
      entity_id: >
        {{ target_switches }}

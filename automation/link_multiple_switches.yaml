blueprint:
  name: Đồng bộ nhiều công tắc
  description: |
    Giữ trạng thái bật/tắt của nhiều công tắc luôn đồng bộ với nhau.
    Khi một công tắc được chọn thay đổi trạng thái, các công tắc đang ở
    trạng thái ngược lại sẽ nhận lệnh bật hoặc tắt tương ứng.

    Các trạng thái `unknown` và `unavailable` sẽ được bỏ qua, không dùng làm
    nguồn kích hoạt hoặc mục tiêu điều khiển.

    Yêu cầu Home Assistant 2022.5.0 trở lên.

    Phát triển dựa trên blueprint gốc của aderusha:
    https://gist.github.com/aderusha/4f25658dbb855675b5b5ccf296fd801b

  domain: automation
  source_url: https://github.com/PATCoder97/ha-blueprints/blob/main/automation/link_multiple_switches.yaml

  homeassistant:
    min_version: 2022.5.0

  input:
    switches:
      name: Các công tắc
      description: Chọn các công tắc cần đồng bộ trạng thái.
      selector:
        entity:
          domain:
            - switch
          multiple: true
          reorder: false

mode: queued
max_exceeded: silent

variables:
  switches: !input switches

trigger:
  - platform: state
    entity_id: !input switches

condition:
  # Bỏ qua sự kiện không có trạng thái mới.
  - condition: template
    value_template: >
      {{ trigger.to_state is not none }}

  # Không đồng bộ khi thực thể vừa đăng ký trạng thái ban đầu.
  - condition: template
    value_template: >
      {{ trigger.from_state is not none }}

  # Bỏ qua unknown, unavailable và các trạng thái khác bật/tắt.
  - condition: template
    value_template: >
      {{ trigger.to_state.state in ['on', 'off'] }}

  # Bỏ qua thay đổi chỉ liên quan đến thuộc tính.
  - condition: template
    value_template: >
      {{ trigger.to_state.state != trigger.from_state.state }}

action:
  # Chỉ điều khiển công tắc đang ở trạng thái ngược lại.
  # Cách này loại bỏ công tắc lỗi và tự ngăn vòng lặp đồng bộ.
  - variables:
      target_switches: >
        {{
          expand(switches)
          | selectattr(
              'state',
              'eq',
              'off' if trigger.to_state.state == 'on' else 'on'
            )
          | map(attribute='entity_id')
          | list
        }}

  # Lượt chờ trong hàng đợi có thể không còn việc sau khi lượt trước hoàn tất.
  - condition: template
    value_template: >
      {{ target_switches | count > 0 }}

  - service: "homeassistant.turn_{{ trigger.to_state.state }}"
    target:
      entity_id: >
        {{ target_switches }}
